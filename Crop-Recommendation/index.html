<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crop Recommendation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #a1c4fd, #c2e9fb);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background: #ecf9f1;
            color: #27ae60;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🌱 Crop Recommendation</h2>

    <form action="/predict" method="post">
        <input type="number" name="N" placeholder="Nitrogen (N)" required>
        <input type="number" name="P" placeholder="Phosphorus (P)" required>
        <input type="number" name="K" placeholder="Potassium (K)" required>
        <input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required>
        <input type="number" step="any" name="humidity" placeholder="Humidity (%)" required>
        <input type="number" step="any" name="ph" placeholder="Soil pH" required>
        <input type="number" step="any" name="rainfall" placeholder="Rainfall (mm)" required>

        <button type="submit">Predict Crop</button>
    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}
    {% if confidence_text %}
        <div class="result">
            {{ confidence_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
